<div class="map-header">
  <h1>Enter your location</h1>

  <!-- Address Input with Suggestions -->
  <div class="address-input">
    <input
      type="text"
      id="address"
      [formControl]="addressControl"
      placeholder="Enter address"
      (focus)="addressSuggestions = []"
    />
    <ul *ngIf="addressSuggestions.length" class="suggestions-list">
      <li
        *ngFor="let suggestion of addressSuggestions"
        (click)="selectAddress(suggestion)"
      >
        {{ suggestion.display_name }}
      </li>
    </ul>
  </div>

  <button (click)="findMe()" class="find-me-btn">Find Me</button>
</div>

<!-- Map Container -->
<div #mapContainer id="map" class="map-container"></div>

<!-- Navigation Buttons -->
<div class="checkout-buttons">
  <button class="button2" (click)="goBack()">&les;</button>
  <button class="button1" (click)="saveAddress()">Continue to Checkout {{ totalPrice }} ALL </button>
</div>
